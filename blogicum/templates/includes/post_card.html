<!-- не получается разбить текст на абзацы. уже все перепробовал -->

<article>
  <ul>
    <li>Место: {{ post.location }}</li>
    <li>Дата: {{ post.date }}</li>
    <li>
      Категория: <a href="{% url 'blog:category_posts' post.category %}">{{ post.category }}</a>
    </li>
  </ul>
  <p>
    {% if truncate %}
      {{ post.text|truncatewords:10}}
    {% else %}
      {{ post.text|linebreaks }}
    {% endif %}
  </p>
  {% if show_link %}
    <a href="{% url 'blog:post_detail' post.id %}">Читать полный текст</a>
  {% endif %}
</article>
